[Service]
# Central host credential files are copied by systemd into a private, read-only
# runtime credential directory and read through $CREDENTIALS_DIRECTORY.
LoadCredential=FABRIC_USERNAME:%h/.config/assetchain/credentials/FABRIC_USERNAME
LoadCredential=FABRIC_PASSWORD:%h/.config/assetchain/credentials/FABRIC_PASSWORD
LoadCredential=APP_SECRET:%h/.config/assetchain/credentials/APP_SECRET
